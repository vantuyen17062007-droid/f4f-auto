name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Khởi tạo Gradle Wrapper và Cấp quyền thực thi
        working-directory: ./android_app
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android_app
        run: ./gradlew assembleDebug --no-daemon

      - name: Đăng tải file APK lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: F4F-AutoRunner-APK
          path: android_app/app/build/outputs/apk/debug/*.apk
          retention-days: 7
